name: Validar outbox de fichas

on:
  pull_request:
    branches:
      - feature/sync-outbox-foundation
      - feature/sync-ficha-outbox
      - fix/sync-client-conflict-and-media-cleanup
  push:
    branches:
      - feature/sync-ficha-outbox

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar pruebas
        env:
          MODO_SERVIDOR: local
          LOCAL_AUTH_SECRET: ci-temporal-local-auth-secret-2026-123456789
        run: npm test

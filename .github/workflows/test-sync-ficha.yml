name: Validar outbox de fichas

on:
  pull_request:
    branches:
      - feature/sync-outbox-foundation
      - feature/sync-ficha-outbox
      - fix/sync-client-conflict-and-media-cleanup
      - fix/ficha-delete-related-tombstones
      - integration/sync-bidireccional-validacion
      - feature/sync-menu-ficha-cover-images
      - feature/reconciliacion-dependencias-relaciones
      - fix/postgres-id-sequences-sync-preparer
      - feature/modo-offline-local-sync-main
  push:
    branches:
      - feature/sync-ficha-outbox
      - integration/sync-bidireccional-validacion
      - fix/windows-cover-path-normalization

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar pruebas
        env:
          MODO_SERVIDOR: local
          LOCAL_AUTH_SECRET: ci-temporal-local-auth-secret-2026-123456789
        run: npm test


<!-- =====================================================
     EXPLORADOR
     Veteranos de Malvinas
     Museo Malvinas
====================================================== -->


<main class="pantalla-veteranos">


    <!-- =================================================
         FONDO / TEXTURA
    ================================================== -->

    <div class="textura-fondo"></div>



    <!-- =================================================
         ENCABEZADO
    ================================================== -->

    <header class="encabezado-veteranos">

        <div class="encabezado-linea superior"></div>

        <div class="encabezado-contenido">

            <div class="marca-archivo">

                <span class="marca-linea"></span>

                <span>ARCHIVO HISTÓRICO · 1982</span>

                <span class="marca-linea"></span>

            </div>


            <h1>
                MALVINAS ARGENTINAS
            </h1>


            <div class="subtitulo">
                VETERANOS · MEMORIA · HISTORIA · HOMENAJE
            </div>


            <div class="separador-titulo">

                <span></span>

                <div class="rombo"></div>

                <span></span>

            </div>

        </div>

        <div class="encabezado-linea inferior"></div>



        <!-- =====================================================
             HOMENAJE LATERAL
        ====================================================== -->

        <div class="frase-homenaje">

            <img
                    src="/imagenes/logo-malvinas.png"
                    alt="Malvinas Argentinas"
                    class="logo-homenaje"
            >

            <p>
                El honor y el valor<br>
                no se olvidan.
            </p>

            <small>
                MEMORIA · HONOR · HISTORIA
            </small>

        </div>


    </header>




    <!-- =================================================
     ÁREA CENTRAL
================================================== -->

    <!-- =================================================
     ÁREA CENTRAL
================================================== -->

    <section class="contenido-central">

        <!-- =================================================
             RECTÁNGULO DOCUMENTAL
             Las fichas aparecen DELANTE de este panel.
        ================================================== -->

        <div class="mensaje-central">

            <!-- =============================================
                 FICHAS
            ============================================== -->

            <div
                    id="contenedorFichas"
                    class="contenedorFichas"
                    aria-live="polite">
            </div>

        </div>

    </section>



    <!-- =================================================
         BARRA DE NAVEGACIÓN INFERIOR
    ================================================== -->

    <nav
            class="barra-navegacion"
            aria-label="Navegación del archivo"
    >


        <!-- =============================================
             ÍNDICE
        ============================================== -->

        <button
                type="button"
                id="btnIndice"
                class="boton-navegacion"
                aria-label="Abrir índice de veteranos"
        >

            <span class="icono-boton">

                <svg
                        viewBox="0 0 24 24"

                >

                    <rect
                            x="5"
                            y="4"
                            width="14"
                            height="16"
                            rx="1"
                    ></rect>

                    <line
                            x1="9"
                            y1="8"
                            x2="16"
                            y2="8"
                    ></line>

                    <line
                            x1="9"
                            y1="12"
                            x2="16"
                            y2="12"
                    ></line>

                    <line
                            x1="9"
                            y1="16"
                            x2="14"
                            y2="16"
                    ></line>

                </svg>

            </span>


            <span class="texto-boton">
                ÍNDICE
            </span>

        </button>



        <!-- =============================================
             BUSCADOR
        ============================================== -->

        <button
                type="button"
                id="btnBuscar"
                class="boton-navegacion"
                aria-label="Buscar veterano"
        >

            <span class="icono-boton">

                <svg
                        viewBox="0 0 24 24"

                >

                    <circle
                            cx="10.8"
                            cy="10.8"
                            r="6.2"
                    ></circle>

                    <line
                            x1="15.5"
                            y1="15.5"
                            x2="20"
                            y2="20"
                    ></line>

                </svg>

            </span>


            <span class="texto-boton">
                BUSCAR
            </span>

        </button>

    </nav>



    <!-- =================================================
         PANEL ÍNDICE
    ================================================== -->

    <aside
            id="panelIndice"
            class="panel-inferior panel-indice"
    >


        <!-- Cabecera -->

        <div class="cabecera-panel">

            <div>

                <span class="etiqueta-panel">
                    ARCHIVO
                </span>


                <h2>
                    Índice de veteranos
                </h2>

            </div>


            <button
                    type="button"
                    id="cerrarIndice"
                    class="cerrar-panel"
                    aria-label="Cerrar índice"
            >
                ×
            </button>

        </div>



        <div class="linea-archivo"></div>



        <!-- Contenido -->

        <div class="contenido-indice">

            <p class="indice-vacio">
                El índice de veteranos aparecerá aquí.
            </p>

        </div>

    </aside>



    <!-- =================================================
         PANEL BUSCADOR
    ================================================== -->

    <aside
            id="panelBusqueda"
            class="panel-inferior panel-busqueda"
    >


        <!-- Cabecera -->

        <div class="cabecera-panel">

            <div>

                <span class="etiqueta-panel">
                    CONSULTA DE ARCHIVO
                </span>


                <h2>
                    Buscar veterano
                </h2>

            </div>


            <button
                    type="button"
                    id="cerrarBusqueda"
                    class="cerrar-panel"
                    aria-label="Cerrar buscador"
            >
                ×
            </button>

        </div>



        <div class="linea-archivo"></div>



        <!-- =============================================
             CAMPO DE BÚSQUEDA
        ============================================== -->

        <div class="campo-busqueda">



            <span
                    class="icono-campo"

            >

                <svg
                        viewBox="0 0 24 24"
                >

                    <circle
                            cx="10.8"
                            cy="10.8"
                            r="6.2"
                    ></circle>

                    <line
                            x1="15.5"
                            y1="15.5"
                            x2="20"
                            y2="20"
                    ></line>

                </svg>

            </span>


            <input
                    type="text"
                    id="buscador"
                    autocomplete="off"
                    autocapitalize="none"
                    spellcheck="false"
                    placeholder="Escriba el nombre del veterano..."
                    aria-label="Buscar veterano"
            >


            <button
                    type="button"
                    id="limpiarBusqueda"
                    class="limpiar-busqueda"
                    data-tecla="limpiar"
                    aria-label="Limpiar búsqueda"
            >
                ×
            </button>


        </div>

        <!-- =================================================
     EJECUTAR CONSULTA
================================================== -->

        <div class="accion-busqueda">

            <span class="marca-consulta"></span>

            <button
                    type="button"
                    id="ejecutarBusqueda"
                    class="boton-ejecutar-busqueda"
            >

        <span class="icono-buscar">

            <svg viewBox="0 0 24 24">

                <circle
                        cx="10.8"
                        cy="10.8"
                        r="6.2"
                ></circle>

                <line
                        x1="15.5"
                        y1="15.5"
                        x2="20"
                        y2="20"
                ></line>

            </svg>

        </span>

                <span class="texto-buscar">
            EJECUTAR CONSULTA
        </span>

            </button>

            <span class="marca-consulta"></span>

        </div>



        <!-- =============================================
             TECLADO VIRTUAL
        ============================================== -->

        <div
                id="tecladoVirtual"
                class="teclado-virtual"
                aria-label="Teclado virtual"
        >


            <!-- Fila 1 -->

            <div class="fila-teclas">

                <button
                        type="button"
                        data-tecla="q"
                >Q</button>

                <button
                        type="button"
                        data-tecla="w"
                >W</button>

                <button
                        type="button"
                        data-tecla="e"
                >E</button>

                <button
                        type="button"
                        data-tecla="r"
                >R</button>

                <button
                        type="button"
                        data-tecla="t"
                >T</button>

                <button
                        type="button"
                        data-tecla="y"
                >Y</button>

                <button
                        type="button"
                        data-tecla="u"
                >U</button>

                <button
                        type="button"
                        data-tecla="i"
                >I</button>

                <button
                        type="button"
                        data-tecla="o"
                >O</button>

                <button
                        type="button"
                        data-tecla="p"
                >P</button>

            </div>



            <!-- Fila 2 -->

            <div class="fila-teclas">

                <button
                        type="button"
                        data-tecla="a"
                >A</button>

                <button
                        type="button"
                        data-tecla="s"
                >S</button>

                <button
                        type="button"
                        data-tecla="d"
                >D</button>

                <button
                        type="button"
                        data-tecla="f"
                >F</button>

                <button
                        type="button"
                        data-tecla="g"
                >G</button>

                <button
                        type="button"
                        data-tecla="h"
                >H</button>

                <button
                        type="button"
                        data-tecla="j"
                >J</button>

                <button
                        type="button"
                        data-tecla="k"
                >K</button>

                <button
                        type="button"
                        data-tecla="l"
                >L</button>

                <button
                        type="button"
                        data-tecla="ñ"
                >Ñ</button>

            </div>



            <!-- Fila 3 -->

            <div class="fila-teclas">

                <button
                        type="button"
                        data-tecla="z"
                >Z</button>

                <button
                        type="button"
                        data-tecla="x"
                >X</button>

                <button
                        type="button"
                        data-tecla="c"
                >C</button>

                <button
                        type="button"
                        data-tecla="v"
                >V</button>

                <button
                        type="button"
                        data-tecla="b"
                >B</button>

                <button
                        type="button"
                        data-tecla="n"
                >N</button>

                <button
                        type="button"
                        data-tecla="m"
                >M</button>


                <button
                        type="button"
                        data-tecla="borrar"
                        class="tecla-especial"
                        aria-label="Borrar último carácter"
                >
                    ←
                </button>

            </div>



            <!-- Fila 4 -->

            <div class="fila-teclas fila-final">

                <button
                        type="button"
                        data-tecla="espacio"
                        class="tecla-espacio"
                >
                    ESPACIO
                </button>

            </div>

        </div>

    </aside>

</main>

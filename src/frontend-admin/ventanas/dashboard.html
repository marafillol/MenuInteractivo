<section class="ventana ventana dashboard">

    </div>

        </div>




        <div class="tarjeta-dashboard">

            <div class="icono-dashboard">

                    Fichas
                </h3>


                <span id="totalFichas">

            </div>

        <div class="tarjeta-dashboard">

            <div class="icono-dashboard">

            </div>


        </div>




        <div class="tarjeta-dashboard">

            <div class="icono-dashboard">

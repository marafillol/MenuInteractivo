
<section id="moduloPlantillas" class="ventana ventana-plantillas">

    <!-- =========================================================
         ENCABEZADO
    ========================================================== -->

    <div class="cabecera-plantillas">

        <h2 class="titulo-plantillas">
            Gestión de Plantillas
        </h2>

        <button
                type="button"
                id="nuevaPlantilla"
                class="btn-nueva-plantilla">
            + Nueva plantilla
        </button>

    </div>


    <!-- =========================================================
         LISTADO DE PLANTILLAS
    ========================================================== -->

    <div
            id="gridPlantillas"
            class="grid-plantillas">
    </div>


    <!-- =========================================================
         MODAL NUEVA / EDITAR PLANTILLA
    ========================================================== -->

    <div
            id="modalPlantilla"
            class="modal-plantilla">

        <div class="contenido-modal-plantilla">

            <button
                    type="button"
                    class="cerrar-modal-plantilla"
                    onclick="cerrarModalPlantilla()"
                    aria-label="Cerrar">
                ✖
            </button>


            <h2 id="tituloModalPlantilla">
                Nueva plantilla
            </h2>


            <!-- =================================================
                 DATOS GENERALES
            ================================================== -->

            <fieldset class="grupo-plantilla">

                <legend>
                    Datos generales
                </legend>

                <label for="nombrePlantilla">
                    Nombre
                </label>

                <input
                        type="text"
                        id="nombrePlantilla"
                        autocomplete="off">


                <label for="descripcionPlantilla">
                    Descripción
                </label>

                <textarea
                        id="descripcionPlantilla"
                        rows="3"></textarea>


                <label class="checkbox-plantilla">

                    <input
                            type="checkbox"
                            id="activoPlantilla"
                            checked>

                    <span>
                        Activa
                    </span>

                </label>

            </fieldset>


            <!-- =================================================
                 DISTRIBUCIÓN
            ================================================== -->

            <fieldset class="grupo-plantilla">

                <legend>
                    Distribución
                </legend>




                <label for="columnasPlantilla">
                    Columnas
                </label>

                <input
                        type="number"
                        id="columnasPlantilla"
                        min="1"
                        max="6"
                        step="1"
                        value="4">


                <label for="formaFichaPlantilla">
                    Forma de la ficha
                </label>

                <select id="formaFichaPlantilla">

                    <option value="rectangular">
                        Rectangular
                    </option>

                    <option value="redondeada">
                        Redondeada
                    </option>

                    <option value="circular">
                        Circular
                    </option>

                </select>



            </fieldset>




            <!-- =================================================
                 APARIENCIA
            ================================================== -->

            <fieldset class="grupo-plantilla">

                <legend>
                    Apariencia
                </legend>


                <label for="colorPrincipalPlantilla">
                    Color principal
                </label>

                <input
                        type="color"
                        id="colorPrincipalPlantilla"
                        value="#163A61">


                <label for="colorSecundarioPlantilla">
                    Color secundario
                </label>

                <input
                        type="color"
                        id="colorSecundarioPlantilla"
                        value="#C7A85B">


                <label for="colorFondoPlantilla">
                    Color del titulo
                </label>

                <input
                        type="color"
                        id="colorFondoPlantilla"
                        value="#E8E0CF">


                <label for="colorTextoPlantilla">
                    Color de lineas
                </label>

                <input
                        type="color"
                        id="colorTextoPlantilla"
                        value="#222222">


                <label for="fuenteTituloPlantilla">
                    Fuente de títulos
                </label>

                <select id="fuenteTituloPlantilla">

                    <option value="Courier New">
                        Courier New
                    </option>

                    <option value="Arial">
                        Arial
                    </option>

                    <option value="Georgia">
                        Georgia
                    </option>

                    <option value="Times New Roman">
                        Times New Roman
                    </option>

                </select>


                <label for="fuenteTextoPlantilla">
                    Fuente del texto
                </label>

                <select id="fuenteTextoPlantilla">

                    <option value="Arial">
                        Arial
                    </option>

                    <option value="Courier New">
                        Courier New
                    </option>

                    <option value="Georgia">
                        Georgia
                    </option>

                    <option value="Times New Roman">
                        Times New Roman
                    </option>

                </select>


            </fieldset>


            <!-- =================================================
                 CAMPOS DE LA FICHA
            ================================================== -->

            <fieldset class="grupo-plantilla">

                <legend>
                    Campos de la ficha
                </legend>


                <button
                        type="button"
                        id="btnNuevoCampo"
                        class="btn-nueva-plantilla">
                    + Agregar campo
                </button>


                <div
                        id="listaCamposPlantilla"
                        class="lista-campos-plantilla">
                </div>

            </fieldset>



            <!-- =================================================
                 GUARDAR PLANTILLA
            ================================================== -->

            <button
                    type="button"
                    id="btnGuardarPlantilla"
                    class="btn-guardar-plantilla">
                Guardar plantilla
            </button>

        </div>

    </div>


    <!-- =========================================================
         MODAL NUEVO / EDITAR CAMPO
    ========================================================== -->

    <div
            id="modalCampoPlantilla"
            class="modal-plantilla">

        <div class="contenido-modal-plantilla-pequeno">

            <button
                    type="button"
                    class="cerrar-modal-plantilla"
                    onclick="cerrarCampoPlantilla()"
                    aria-label="Cerrar">
                ✖
            </button>


            <h2>
                Nuevo campo
            </h2>


            <label for="etiquetaCampo">
                Etiqueta
            </label>

            <input
                    id="etiquetaCampo"
                    type="text"
                    autocomplete="off">


            <label for="nombreCampo">
                Nombre interno
            </label>

            <input
                    id="nombreCampo"
                    type="text"
                    autocomplete="off">


            <label for="tipoCampo">
                Tipo
            </label>

            <select id="tipoCampo">

                <option value="text">
                    Texto
                </option>

                <option value="textarea">
                    Área de texto
                </option>

                <option value="date">
                    Fecha
                </option>

                <option value="number">
                    Número
                </option>

            </select>



            <div class="acciones-modal-plantilla">

                <button
                        type="button"
                        id="btnGuardarCampo"
                        class="btn-guardar-plantilla">
                    Guardar
                </button>


                <button
                        type="button"
                        class="btn-cancelar-plantilla"
                        onclick="cerrarCampoPlantilla()">
                    Cancelar
                </button>

            </div>

        </div>

    </div>


    <!-- =========================================================
         MODAL CONFIRMAR ELIMINACIÓN DE CAMPO
    ========================================================== -->

    <div
            id="modalEliminarCampo"
            class="modal-plantilla">

        <div class="contenido-modal-confirmacion">

            <button
                    type="button"
                    class="cerrar-modal-plantilla"
                    onclick="cerrarEliminarCampoPlantilla()"
                    aria-label="Cerrar">
                ✖
            </button>


            <h3>
                Eliminar campo
            </h3>


            <p>
                ¿Está seguro que desea eliminar este campo?
            </p>


            <div class="acciones-modal-plantilla">

                <button
                        type="button"
                        class="btn-cancelar-plantilla"
                        onclick="cerrarEliminarCampoPlantilla()">
                    Cancelar
                </button>


                <button
                        type="button"
                        class="btn-eliminar-plantilla"
                        onclick="confirmarEliminarCampo()">
                    Eliminar
                </button>

            </div>

        </div>

    </div>


    <!-- =========================================================
         MODAL VISTA PREVIA
    ========================================================== -->

    <div
            id="modalVistaPlantilla"
            class="modal-plantilla">

        <div class="contenido-modal-preview">

            <button
                    type="button"
                    class="cerrar-preview-plantilla"
                    onclick="cerrarPreviewPlantilla()"
                    aria-label="Cerrar">
                ✖
            </button>


            <h2>
                Vista previa plantilla
            </h2>


            <div id="contenidoVistaPlantilla"></div>

        </div>

    </div>


    <!-- =========================================================
         MODAL ELIMINAR PLANTILLA
    ========================================================== -->

    <div
            id="modalEliminarPlantilla"
            class="modal-plantilla">

        <div class="contenido-modal-eliminar-plantilla">

            <button
                    type="button"
                    class="cerrar-modal-plantilla"
                    onclick="cerrarEliminarPlantilla()"
                    aria-label="Cerrar">
                ✖
            </button>


            <h2 class="titulo-plantillas">
                Eliminar plantilla
            </h2>


            <p id="mensajeEliminarPlantilla">
                ¿Seguro que desea eliminar esta plantilla?
            </p>


            <div class="acciones-modal-plantilla">

                <button
                        type="button"
                        class="btn-cancelar-plantilla"
                        onclick="cerrarEliminarPlantilla()">
                    Cancelar
                </button>


                <button
                        type="button"
                        class="btn-eliminar-plantilla"
                        onclick="confirmarEliminarPlantilla()">
                    Eliminar
                </button>

            </div>

        </div>

    </div>


    <!-- =========================================================
         MODAL MENSAJE
    ========================================================== -->

    <div
            id="modalMensajePlantilla"
            class="modal-plantilla">

        <div class="contenido-modal-mensaje-plantilla">

            <button
                    type="button"
                    class="cerrar-modal-plantilla"
                    onclick="cerrarMensajePlantilla()"
                    aria-label="Cerrar">
                ✖
            </button>


            <h2 id="tituloMensajePlantilla">
                Aviso
            </h2>


            <p id="textoMensajePlantilla"></p>


            <div class="acciones-modal-plantilla">

                <button
                        type="button"
                        class="btn-aceptar-plantilla"
                        onclick="cerrarMensajePlantilla()">
                    Aceptar
                </button>

            </div>

        </div>

    </div>

</section>

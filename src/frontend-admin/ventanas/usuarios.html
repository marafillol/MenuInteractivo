<section class="ventana ventana-usuarios">

    <!-- =====================================================
         ENCABEZADO
    ====================================================== -->

    <div class="encabezado-usuarios">

        <h2 class="titulo-usuarios">
            Gestión de Usuarios
        </h2>

        <button
                type="button"
                class="btn-nuevo-usuario"
                onclick="abrirModalUsuarioUsuarios()"
        >
            + Nuevo Usuario
        </button>

    </div>


    <!-- =====================================================
         TABLA DE USUARIOS
    ====================================================== -->

    <div class="contenedor-tabla-usuarios">

        <table class="tabla-usuarios">

            <thead>
            <tr>
                <th>Nombre</th>
                <th>Email</th>
                <th>Rol</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>

            <tbody id="tablaUsuarios"></tbody>

        </table>

    </div>

</section>


<!-- =========================================================
     MODAL NUEVO / EDITAR USUARIO
========================================================== -->

<div
        id="modalUsuarioUsuarios"
        class="modal-usuarios"
        style="display: none;"
>

    <div class="contenido-modal-usuarios">

        <h2 id="tituloModalUsuarioUsuarios">
            Nuevo Usuario
        </h2>


        <!-- NOMBRE -->

        <label for="nombreUsuarioNuevo">
            Nombre
        </label>

        <input
                id="nombreUsuarioNuevo"
                type="text"
                placeholder="Nombre completo"
        >


        <!-- EMAIL -->

        <label for="emailUsuarioNuevo">
            Email
        </label>

        <input
                id="emailUsuarioNuevo"
                type="email"
                placeholder="correo@ejemplo.com"
        >


        <!-- CONTRASEÑA -->

        <div id="contenedorPassword">

            <label for="passwordUsuarioNuevo">
                Contraseña
            </label>

            <input
                    id="passwordUsuarioNuevo"
                    type="password"
                    placeholder="Contraseña"
            >

        </div>


        <!-- ROL -->

        <label for="rolUsuarioNuevo">
            Rol
        </label>

        <select id="rolUsuarioNuevo">

            <option value="admin">
                Administrador
            </option>

            <option value="editor">
                Editor
            </option>

            <option value="consulta">
                Consulta
            </option>

        </select>


        <!-- ESTADO -->

        <label class="checkbox-usuario">

            <input
                    id="activoUsuarioNuevo"
                    type="checkbox"
                    checked
            >

            Usuario activo

        </label>


        <!-- ACCIONES -->

        <div class="acciones-modal-usuarios">

            <button
                    type="button"
                    onclick="cerrarModalUsuarioUsuarios()"
            >
                Cancelar
            </button>

            <button
                    type="button"
                    class="btn-nuevo-usuario"
                    onclick="guardarUsuarioUsuarios()"
            >
                Guardar
            </button>

        </div>

    </div>

</div>


<!-- =========================================================
     MODAL CAMBIO DE CONTRASEÑA
========================================================== -->

<div
        id="modalPasswordUsuarios"
        class="modal-usuarios"
        style="display: none;"
>

    <div class="contenido-modal-usuarios">

        <h2>
            Cambiar contraseña
        </h2>


        <label for="nuevaPassword">
            Nueva contraseña
        </label>

        <input
                id="nuevaPassword"
                type="password"
                placeholder="Nueva contraseña"
        >


        <!-- ACCIONES -->

        <div class="acciones-modal-usuarios">

            <button
                    type="button"
                    onclick="cerrarModalPasswordUsuarios()"
            >
                Cancelar
            </button>

            <button
                    type="button"
                    class="btn-nuevo-usuario"
                    onclick="guardarPasswordUsuarios()"
            >
                Guardar
            </button>

        </div>

    </div>

</div>


<!-- =========================================================
     MODAL MENSAJE
========================================================== -->

<div
        id="modalMensajeUsuarios"
        class="modal-usuarios"
        style="display: none;"
>

    <div class="contenido-modal-mensaje-usuarios">

        <h2 id="tituloMensajeUsuarios">
            Mensaje
        </h2>

        <p id="textoMensajeUsuarios"></p>


        <div class="acciones-modal-usuarios">

            <button
                    id="btnAceptarMensajeUsuarios"
                    type="button"
                    class="btn-nuevo-usuario"
            >
                Aceptar
            </button>

        </div>

    </div>

</div>


<!-- =========================================================
     MODAL CONFIRMAR ELIMINACIÓN
========================================================== -->

<div
        id="modalEliminarUsuarios"
        class="modal-usuarios"
        style="display: none;"
>

    <div class="contenido-modal-eliminar-usuarios">

        <h2>
            Confirmar eliminación
        </h2>

        <p id="textoEliminarUsuarios"></p>


        <div class="acciones-modal-usuarios">

            <button
                    id="btnCancelarEliminarUsuarios"
                    type="button"
            >
                Cancelar
            </button>

            <button
                    id="btnConfirmarEliminarUsuarios"
                    type="button"
                    class="btn-nuevo-usuario"
            >
                Eliminar
            </button>

        </div>

    </div>

</div>

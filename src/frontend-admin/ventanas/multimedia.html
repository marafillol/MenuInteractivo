<section class="ventana ventana-multimedia">

    <!-- =======================================
     CABECERA MULTIMEDIA
======================================== -->

    <!-- =================================================
     CABECERA GENERAL
================================================= -->

    <div
            id="cabeceraMultimediaGeneral"
            class="cabecera-multimedia-panel">

        <div class="titulo-multimedia-panel">

            <h2 id="tituloMultimedia">
                Gestión de Multimedia
            </h2>



        </div>


        <button
                id="nuevoMultimedia"
                class="btn-nuevo-multimedia"
                onclick="nuevoMultimedia()">

            + Nuevo archivo

        </button>

    </div>


    <!-- =================================================
         CABECERA DE MULTIMEDIA DE UNA FICHA
    ================================================= -->

    <div
            id="cabeceraMultimediaFicha"
            class="cabecera-multimedia-ficha"
            style="display:none;">

        <button
                id="barraVolverFicha"
                class="btn-volver-multimedia"
                onclick="volverFicha()">

            ← Volver a fichas

        </button>


        <div class="titulo-multimedia-ficha">

            <h2 id="tituloFichaMultimedia">
                Multimedia asociada a la ficha
            </h2>

            <p id="nombreFichaMultimedia">
            </p>

        </div>


        <!-- NUEVO ARCHIVO PARA ESTA FICHA -->

        <button
                id="nuevoMultimediaFicha"
                class="btn-nuevo-multimedia"
                type="button"
                onclick="nuevoMultimediaDesdeFicha()">

            + Nuevo archivo

        </button>

    </div>





    <!-- =======================================
     PANEL CUANDO VIENE DESDE UNA FICHA
======================================== -->

    <!-- =======================================
     MULTIMEDIA DE UNA FICHA
======================================== -->

    <div
            id="panelFichaMultimedia"
            class="panel-ficha-multimedia-contenedor"
            style="display:none;">

        <div
                id="listaMultimedia"
                class="grid-multimedia">
        </div>

    </div>



    <!-- =======================================
         VISTA GENERAL
    ======================================== -->

    <div id="vistaGeneralMultimedia">

        <div
                id="listaMultimediaGeneral"
                class="grid-multimedia">
        </div>

    </div>



    <!-- =======================================
     MODAL VISTA PREVIA MULTIMEDIA
======================================== -->

    <div
            id="modalVistaMultimedia"
            class="modal-multimedia">

        <div class="contenido-modal-multimedia vista-modal">


            <button
                    class="cerrar-multimedia"
                    type="button"
                    aria-label="Cerrar vista previa multimedia"
                    onclick="cerrarVistaMultimedia()">

                <i data-lucide="x" aria-hidden="true"></i>

            </button>


            <div class="cabecera-vista-multimedia">

                <h2>
                    <i  aria-hidden="true"></i> Vista previa multimedia
                </h2>


            </div>



            <div id="contenidoVistaMultimedia">

            </div>


        </div>

    </div>


    <!-- =======================================
         NUEVO MULTIMEDIA
    ======================================== -->

    <div
            id="modalMultimediaNuevo"
            class="modal-multimedia">

        <div class="contenido-modal-multimedia">

            <button
                    class="cerrar-multimedia"
                    type="button"
                    aria-label="Cerrar nuevo archivo"
                    onclick="cerrarNuevoMultimedia()">

                <i data-lucide="x" aria-hidden="true"></i>

            </button>

            <h3>
                Nuevo archivo
            </h3>

            <div id="contenedorFichaMultimedia">

                <label>Ficha</label>

                <select id="multiFicha"></select>

            </div>

            <label>Descripción</label>

            <input
                    type="text"
                    id="multiDescripcion"
                    placeholder="Descripción del archivo">

            <label>Tipo</label>

            <select id="multiTipo">

                <option value="imagen">Imagen</option>

                <option value="video">Video</option>

                <option value="audio">Audio</option>

                <option value="pdf">PDF</option>

            </select>

            <label>Archivo</label>

            <input
                    type="file"
                    id="multiArchivo">

            <div id="previewArchivoActual" class="preview-archivo-actual" style="display:none;">

                <h4>Archivo actual</h4>

                <div id="contenidoPreviewArchivo"></div>

            </div>


            <label class="checkbox-label">

                <input
                        type="checkbox"
                        id="multiActivo"
                        checked>

                Activo

            </label>

            <div class="acciones-modal-multimedia">

                <button onclick="guardarMultimedia()">
                    Guardar
                </button>

                <button onclick="cerrarNuevoMultimedia()">
                    Cancelar
                </button>

            </div>

        </div>

    </div>



    <!-- =======================================
         ELIMINAR MULTIMEDIA
    ======================================== -->

    <div
            id="modalEliminarMultimedia"
            class="modal-multimedia">

        <div class="contenido-modal-multimedia">

            <button
                    class="cerrar-multimedia"
                    type="button"
                    aria-label="Cerrar eliminacion de multimedia"
                    onclick="cerrarEliminarMultimedia()">

                <i data-lucide="x" aria-hidden="true"></i>

            </button>

            <h3>
                Eliminar multimedia
            </h3>

            <p>
                 ¿Desea eliminar este archivo multimedia?
            </p>

            <div class="acciones-modal-multimedia">

                <button
                        class="btn-eliminar-multimedia"
                        onclick="confirmarEliminarMultimedia()">

                    Eliminar

                </button>

                <button
                        class="btn-ver-multimedia"
                        onclick="cerrarEliminarMultimedia()">

                    Cancelar

                </button>

            </div>

        </div>

    </div>


    <!-- =======================================
     MENSAJES
======================================= -->

    <div
            id="modalMensaje"
            class="modal-multimedia">

        <div class="contenido-modal-multimedia">

            <div class="encabezado-modal">

                <h3 id="tituloMensaje">
                    Mensaje
                </h3>

                <button
                        class="cerrar-modal"
                        type="button"
                        aria-label="Cerrar mensaje"
                        onclick="cerrarMensaje()">

                    <i data-lucide="x" aria-hidden="true"></i>

                </button>

            </div>

            <p
                    id="textoMensaje"
                    class="mensaje-confirmacion">
            </p>

            <div class="acciones-modal-multimedia">

                <button
                        class="btn-ver-multimedia"
                        onclick="cerrarMensaje()">

                    Aceptar

                </button>

            </div>

        </div>

    </div>



    <!-- =======================================
     VISOR COMPLETO PDF
======================================= -->

    <div
            id="modalDocumentoCompleto"
            class="modal-multimedia">

        <div class="contenido-modal-multimedia documento-completo-multimedia">

            <button
                    class="cerrar-multimedia"
                    type="button"
                    aria-label="Cerrar documento"
                    onclick="cerrarDocumentoCompleto()">

                <i data-lucide="x" aria-hidden="true"></i>

            </button>

            <h2>
                Documento completo
            </h2>

            <iframe
                    id="visorDocumentoCompleto"
                    class="visor-documento-completo">
            </iframe>

        </div>

    </div>

</section>

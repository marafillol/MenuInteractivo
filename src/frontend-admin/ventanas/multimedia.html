
<section class="ventana ventana-multimedia">

    <!-- =========================================================
         CABECERA GENERAL
    ========================================================= -->

    <div
            id="cabeceraMultimediaGeneral"
            class="cabecera-multimedia-panel">

        <div class="titulo-multimedia-panel">

            <h2 id="tituloMultimedia">
                Gestión de Multimedia
            </h2>

        </div>

        <button
                id="nuevoMultimedia"
                class="btn-nuevo-multimedia"
                type="button"
                onclick="nuevoMultimedia()">

            + Nuevo archivo

        </button>

    </div>


    <!-- =========================================================
         CABECERA DE MULTIMEDIA DE UNA FICHA
    ========================================================= -->

    <div
            id="cabeceraMultimediaFicha"
            class="cabecera-multimedia-ficha"
            style="display: none;">

        <button
                id="barraVolverFicha"
                class="btn-volver-multimedia"
                type="button"
                onclick="volverFicha()">

            ← Volver a fichas

        </button>


        <div class="titulo-multimedia-ficha">

            <h2 id="tituloFichaMultimedia">
                Multimedia asociada a la ficha
            </h2>

            <p id="nombreFichaMultimedia"></p>

        </div>


        <button
                id="nuevoMultimediaFicha"
                class="btn-nuevo-multimedia"
                type="button"
                onclick="nuevoMultimediaDesdeFicha()">

            + Nuevo archivo

        </button>

    </div>


    <!-- =========================================================
         MULTIMEDIA ASOCIADA A UNA FICHA
    ========================================================= -->

    <div
            id="panelFichaMultimedia"
            class="panel-ficha-multimedia-contenedor"
            style="display: none;">

        <div
                id="listaMultimedia"
                class="grid-multimedia">
        </div>

    </div>


    <!-- =========================================================
         VISTA GENERAL DE MULTIMEDIA
    ========================================================= -->

    <div id="vistaGeneralMultimedia">

        <div
                id="listaMultimediaGeneral"
                class="grid-multimedia">
        </div>

    </div>


    <!-- =========================================================
         MODAL — VISTA PREVIA MULTIMEDIA
    ========================================================= -->

    <div
            id="modalVistaMultimedia"
            class="modal-multimedia">

        <div class="contenido-modal-multimedia vista-modal">


            <!-- CERRAR -->

            <button
                    class="cerrar-multimedia"
                    type="button"
                    aria-label="Cerrar vista previa multimedia"
                    onclick="cerrarVistaMultimedia()">

                <i
                        data-lucide="x"
                        aria-hidden="true">
                </i>

            </button>


            <!-- CABECERA -->

            <div class="cabecera-vista-multimedia">

                <h2>
                    Vista previa multimedia
                </h2>

            </div>


            <!-- CONTENIDO DINÁMICO -->

            <div id="contenidoVistaMultimedia"></div>


        </div>

    </div>


    <!-- =========================================================
         MODAL — NUEVO / EDITAR MULTIMEDIA
    ========================================================= -->

    <div
            id="modalMultimediaNuevo"
            class="modal-multimedia">

        <div class="contenido-modal-multimedia">


            <!-- CERRAR -->

            <button
                    class="cerrar-multimedia"
                    type="button"
                    aria-label="Cerrar nuevo archivo"
                    onclick="cerrarNuevoMultimedia()">

                <i
                        data-lucide="x"
                        aria-hidden="true">
                </i>

            </button>


            <!-- TÍTULO -->

            <h3>
                Nuevo archivo
            </h3>


            <!-- FICHA -->

            <div id="contenedorFichaMultimedia">

                <label for="multiFicha">
                    Ficha
                </label>

                <select id="multiFicha"></select>

            </div>


            <!-- DESCRIPCIÓN -->

            <label for="multiDescripcion">
                Descripción
            </label>

            <input
                    type="text"
                    id="multiDescripcion"
                    placeholder="Descripción del archivo">


            <!-- TIPO -->

            <label for="multiTipo">
                Tipo
            </label>

            <select id="multiTipo">

                <option value="imagen">
                    Imagen
                </option>

                <option value="video">
                    Video
                </option>

                <option value="audio">
                    Audio
                </option>

                <option value="pdf">
                    PDF
                </option>

            </select>


            <!-- ARCHIVO -->

            <label for="multiArchivo">
                Archivo
            </label>

            <input
                    type="file"
                    id="multiArchivo">


            <!-- PREVIEW DEL ARCHIVO ACTUAL -->

            <div
                    id="previewArchivoActual"
                    class="preview-archivo-actual"
                    style="display: none;">

                <h4>
                    Archivo actual
                </h4>

                <div id="contenidoPreviewArchivo"></div>

            </div>


            <!-- ESTADO -->

            <label class="checkbox-label">

                <input
                        type="checkbox"
                        id="multiActivo"
                        checked>

                Activo

            </label>


            <!-- ACCIONES -->

            <div class="acciones-modal-multimedia">

                <button
                        type="button"
                        onclick="guardarMultimedia()">

                    Guardar

                </button>

                <button
                        type="button"
                        onclick="cerrarNuevoMultimedia()">

                    Cancelar

                </button>

            </div>


        </div>

    </div>


    <!-- =========================================================
         MODAL — ELIMINAR MULTIMEDIA
    ========================================================= -->

    <div
            id="modalEliminarMultimedia"
            class="modal-multimedia">

        <div class="contenido-modal-multimedia">


            <!-- CERRAR -->

            <button
                    class="cerrar-multimedia"
                    type="button"
                    aria-label="Cerrar eliminación de multimedia"
                    onclick="cerrarEliminarMultimedia()">

                <i
                        data-lucide="x"
                        aria-hidden="true">
                </i>

            </button>


            <!-- TÍTULO -->

            <h3>
                Eliminar multimedia
            </h3>


            <!-- MENSAJE -->

            <p>
                ¿Desea eliminar este archivo multimedia?
            </p>


            <!-- ACCIONES -->

            <div class="acciones-modal-multimedia">

                <button
                        type="button"
                        class="btn-eliminar-multimedia"
                        onclick="confirmarEliminarMultimedia()">

                    Eliminar

                </button>

                <button
                        type="button"
                        class="btn-ver-multimedia"
                        onclick="cerrarEliminarMultimedia()">

                    Cancelar

                </button>

            </div>


        </div>

    </div>


    <!-- =========================================================
         MODAL — MENSAJES / VALIDACIONES
    ========================================================= -->

    <div
            id="modalMensaje"
            class="modal-multimedia">

        <div class="contenido-modal-multimedia">


            <!-- CABECERA DEL MENSAJE -->

            <div class="encabezado-modal">

                <h3 id="tituloMensaje">
                    Mensaje
                </h3>

                <button
                        class="cerrar-modal"
                        type="button"
                        aria-label="Cerrar mensaje"
                        onclick="cerrarMensaje()">

                    <i
                            data-lucide="x"
                            aria-hidden="true">
                    </i>

                </button>

            </div>


            <!-- MENSAJE -->

            <p
                    id="textoMensaje"
                    class="mensaje-confirmacion">
            </p>


            <!-- ACCIÓN -->

            <div class="acciones-modal-multimedia">

                <button
                        type="button"
                        class="btn-ver-multimedia"
                        onclick="cerrarMensaje()">

                    Aceptar

                </button>

            </div>


        </div>

    </div>


    <!-- =========================================================
         MODAL — DOCUMENTO PDF COMPLETO
    ========================================================= -->

    <div
            id="modalDocumentoCompleto"
            class="modal-multimedia">

        <div
                class="contenido-modal-multimedia documento-completo-multimedia">


            <!-- CERRAR -->

            <button
                    class="cerrar-multimedia"
                    type="button"
                    aria-label="Cerrar documento"
                    onclick="cerrarDocumentoCompleto()">

                <i
                        data-lucide="x"
                        aria-hidden="true">
                </i>

            </button>


            <!-- TÍTULO -->

            <h2>
                Documento completo
            </h2>


            <!-- VISOR -->

            <iframe
                    id="visorDocumentoCompleto"
                    class="visor-documento-completo">
            </iframe>


        </div>

    </div>

</section>
